name: keep-alive

# Pings the Render service to prevent free-tier spin-down, but only during
# 05:00-22:00 Israel time (Asia/Jerusalem, DST-aware via the hour check below).

on:
  schedule:
    - cron: '*/10 2-20 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping only during 05:00-22:00 Israel time
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          HOUR=$((10#$HOUR))
          echo "Jerusalem hour: $HOUR"
          if [ "$HOUR" -ge 5 ] && [ "$HOUR" -lt 22 ]; then
            echo "Within 05:00-22:00 window - pinging..."
            curl -fsS -m 30 https://paccool-temp-monitor.onrender.com/api/ping && echo "" && echo "Ping OK"
          else
            echo "Outside window ($HOUR) - skipping ping."
          fi
